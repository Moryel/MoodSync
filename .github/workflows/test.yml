name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Linux desktop tools (virtual X11 screen, idle time)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xprintidle xcompmgr

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mediapipe

      - name: Unit tests
        run: |
          status=0
          python -m unittest discover -s tests -v > unittest.log 2>&1 || status=$?
          cat unittest.log
          if [ $status -ne 0 ]; then python tests/ci_annotate.py "Unit tests" unittest.log; fi
          exit $status

      - name: Screen guard parts
        if: runner.os != 'Linux'
        run: python tests/guard_check.py

      - name: Screen guard parts (Linux X11 desktop with a compositor)
        if: runner.os == 'Linux'
        env:
          GUARD_ENV: X11 + compositor
        run: xvfb-run -a bash -c "xcompmgr & sleep 1; python tests/guard_check.py"

      # On Linux this runs without any screen (like a server or Wayland)
      - name: Start-up check, focus program
        run: python tests/smoke_run.py focus --camera --flash-guard --dim-white

      - name: Start-up check, focus program (Linux X11 desktop)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c "xcompmgr & sleep 1; python tests/smoke_run.py focus --camera --flash-guard --dim-white"

      - name: Start-up check, screen program
        if: runner.os != 'Linux'
        run: python tests/smoke_run.py screen --flash-guard --dim-white

      - name: Start-up check, screen program (Linux X11 desktop)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c "xcompmgr & sleep 1; python tests/smoke_run.py screen --flash-guard --dim-white"
